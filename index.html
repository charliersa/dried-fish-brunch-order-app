<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c5e7a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小魚乾點餐" />
  <script src="pwa-install.js" data-note="開啟更快、全螢幕，餐點好了還能通知你" defer></script>
  <title>小魚乾早午餐 · 線上點餐</title>
  <style>
    /* 共用樣式由 shared.js 於頁尾注入 */
    .cat-bar {
      position: sticky;
      top: 0;
      z-index: 25;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px;
      margin: 0 -16px 14px;
      background: var(--bg-top);
      border-bottom: 1px solid var(--line);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .cat-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      flex: 0 0 auto;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      font-weight: 700;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-chip.active {
      background: var(--pink);
      border-color: var(--pink);
      color: #fff;
    }

    .section {
      scroll-margin-top: 60px;
    }

    .menu-card {
      cursor: pointer;
    }

    .opt-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .opt-chip {
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      font-weight: 700;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .opt-chip.active {
      background: var(--pink);
      border-color: var(--pink);
      color: #fff;
    }

    .menu-info {
      min-width: 0;
      flex: 1;
    }

    .menu-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .menu-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--pink);
    }

    .add-circle {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--pink);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(216, 75, 132, .3);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .circle-button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .circle-button.filled {
      border: none;
      background: var(--pink);
      color: #fff;
    }

    .cart-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      max-width: 608px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: none;
      background: var(--pink);
      color: #fff;
      padding: 14px 18px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(216, 75, 132, .4);
      z-index: 30;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 50, 65, .45);
      z-index: 40;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet {
      width: 100%;
      max-width: 640px;
      background: #f4fafd;
      border-radius: 22px 22px 0 0;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px 18px 22px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .line-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
    }

    .small-button {
      border: none;
      background: none;
      cursor: pointer;
      color: #c9899f;
      font-size: 16px;
    }

    .toggle-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .toggle-row button {
      flex: 1;
      gap: 6px;
      border: 2px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      cursor: pointer;
      font-weight: 700;
      padding: 10px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-row button.active {
      border-color: var(--pink);
      color: var(--pink-deep);
    }

    .input-group {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      background: #fff;
    }

    .button-submit {
      width: 100%;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      background: var(--pink);
      color: #fff;
      font-weight: 900;
      font-size: 17px;
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(216, 75, 132, .35);
      cursor: pointer;
    }

    /* ===== 附加商品（圖片卡片）===== */
    .addon-intro {
      color: var(--ink-soft);
      font-size: 13px;
      margin: -4px 2px 12px;
    }

    .addon-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      margin: 0 -2px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .addon-grid::-webkit-scrollbar {
      display: none;
    }

    .addon-card {
      flex: 0 0 190px;
      scroll-snap-align: start;
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(28, 94, 122, .10);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, .6);
    }

    .addon-thumb {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      background: var(--pink-bg);
      display: block;
    }

    .addon-thumb-ph {
      width: 100%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      background: var(--pink-bg);
    }

    .addon-body {
      padding: 10px 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .addon-name {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.25;
    }

    .addon-price {
      color: var(--pink-deep);
      font-weight: 900;
      font-size: 17px;
    }

    .addon-price .orig {
      text-decoration: line-through;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 700;
      margin-right: 6px;
    }

    .addon-opts {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .addon-opts button {
      flex: 1 1 auto;
      min-width: 0;
      padding: 6px 4px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      background: #fff;
      color: var(--ink-soft);
      border: 1.5px solid var(--line);
      white-space: nowrap;
      cursor: pointer;
    }

    .addon-opts button.on {
      background: var(--ink-soft);
      color: #fff;
      border-color: var(--ink-soft);
    }

    .addon-add {
      margin-top: auto;
      width: 100%;
      padding: 9px;
      border-radius: 11px;
      background: var(--pink);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="top-row">
        <div class="brand">
          <div class="brand-logo">🐟</div>
          <div class="brand-text">
            <h1>小魚乾早午餐</h1>
            <p>DRIED FISH BRUNCH</p>
          </div>
        </div>
        <div class="info-chip">⏰ 6:00–12:00</div>
      </div>
      <div class="address">📍 台南市東區長東街 106 號 · 現點現做，請耐心等候</div>
      <div class="nav-pills">
        <!-- 店家公告：沒有公告時自動隱藏；按下開啟懸浮公告視窗 -->
        <button type="button" id="ann-pill" style="display:none;">📢 店家公告</button>
        <a href="feedback.html">💬 點餐回饋表單</a>
        <a href="#sec-addons">🧋 附加商品</a>
        <!-- 只有「還沒裝且裝得起來」時，pwa-install.js 才會把這顆按鈕顯示出來 -->
        <button type="button" data-pwa-install style="display:none;">📲 安裝 App</button>
      </div>
    </header>
    <main id="app"></main>
  </div>

  <div id="cart-bar" class="cart-bar" style="display:none;">
    <span id="cart-info"></span>
    <span style="font-weight:900;">前往結帳 →</span>
  </div>

  <!-- 懸浮公告視窗掛載點 -->
  <div id="ann-modal"></div>

  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="neworder-sound.js"></script>
  <script src="shared.js"></script>
  <!-- 讓後台看得到「現在幾人在看」：每分鐘送一次心跳 -->
  <script src="presence.js" data-page="手機點餐"></script>
  <script>document.head.insertAdjacentHTML('beforeend', '<style>' + getSharedStyles() + '</style>');</script>
  <script>
    applyDeviceCodeFromUrl();
    const app = document.getElementById('app');
    const cartBar = document.getElementById('cart-bar');
    const cartInfo = document.getElementById('cart-info');
    let orders = loadOrders();

    // 附加商品預設種子（雲端 config/addons 還沒建立時顯示）；店家在管理後台 admin.html 的「附加商品」分頁維護
    // （改這裡也要同步改 Dried-Fish-Brunch/admin.html 的 DEFAULT_ADDONS）
    const DEFAULT_ADDONS = [
      { id: 'addon-milktea', name: '鮮乳',
        img: 'https://res.cloudinary.com/dbiirpmpy/image/upload/v1785163481/fish-brunch/Fresh_milk_tea.png',
        options: [ { id: 'bottle900', label: '900ml罐', price: 85, orig: 105 } ] },
      { id: 'addon-radishcake', name: '手作蘿蔔糕',
        img: 'https://res.cloudinary.com/dbiirpmpy/image/upload/v1784949177/fish-brunch/Radish_cake_512.png',
        options: [ { id: 'whole', label: '1條', price: 230 } ] },
    ];

    const state = {
      cart: [],            // [{ lineId, id, temp, note, qty, opt, extras }]
      diningType: '內用',
      tableInfo: '',
      phone: '',
      memberPhone: '',
      note: '',
      cartOpen: false,
      activeItem: null,    // 商品詳情彈窗中的品項 id
      itemTemp: '冷',
      itemQty: 1,
      itemNote: '',
      itemOptions: [],
      itemDrink: -1,       // 已選的換飲料選項（item.addons 的索引；-1 = 維持套餐原本飲料）
      itemAdds: [],        // 已選的加購選項（item.addons 的索引，可複選）
      addons: [],          // 附加商品清單（來自 config/addons）
      addonOpt: {},        // addonId -> 已選規格 id
      currentOrderId: null,
      submitting: false,
      ack: null,           // 訂單送達狀態：null=未知 / 'pending'=傳送中 / 'stuck'=逾時未達 / 'sent'=店家已接收
      showBoard: false,
      justPickedId: '',
    };

    // 叫號板：準備取餐(藍)→已可取餐(紅)；顧客可按自己的紅色號碼確認取餐(變藍→消失)
    function renderCallBoard(highlightNo) {
      const today = orders.filter(o => isToday(o.createdAt));
      const preparing = today.filter(o => !o.notified && !o.picked).sort((a, b) => a.createdAt - b.createdAt);          // 藍：製作中/排隊（尚未被通知取餐）
      const ready = today.filter(o => o.notified && !o.picked).sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt)); // 紅：可取餐（廚房按通知取餐後亮，顧客按取餐後消失）
      const justPicked = state.justPickedId ? today.find(o => o.id === state.justPickedId) : null; // 剛按取餐→短暫顯示藍色

      const prepChip = (o) => {
        const own = o.no === highlightNo;
        const style = own ? 'background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(62,155,209,.45);' : 'background:var(--blue-bg);color:var(--blue);border:2px solid var(--blue);';
        return `<span style="display:inline-flex;align-items:center;justify-content:center;min-width:60px;padding:10px 14px;border-radius:14px;font-size:22px;font-weight:900;${style}">${escapeHtml(o.no)}</span>`;
      };
      const readyChip = (o) => {
        const own = o.no === highlightNo; // 自己的號碼特別強調
        const label = own ? '👆 按我確認取餐' : '👆 取餐';
        const style = own
          ? 'background:#e5534b;color:#fff;border:none;box-shadow:0 4px 12px rgba(229,83,75,.45);'
          : 'background:#fff;color:#e5534b;border:2px solid #e5534b;';
        return `<button data-action="self-pickup" data-id="${o.id}" style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px;padding:9px 16px;font-weight:900;cursor:pointer;${style}"><span style="font-size:22px;">${escapeHtml(o.no)}</span><span style="font-size:11px;font-weight:700;">${label}</span></button>`;
      };
      const pickedChip = (o) => `<span style="display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:14px;font-size:18px;font-weight:900;background:var(--blue);color:#fff;">${escapeHtml(o.no)} ✅已取餐</span>`;

      const readyList = (justPicked ? pickedChip(justPicked) : '') + ready.map(readyChip).join('');
      return `
        <div style="background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(28,94,122,.07);">
          <div style="font-weight:900;font-size:16px;">🔔 叫號板</div>
          <div style="margin-top:10px;">
            <div style="font-weight:900;font-size:14px;margin-bottom:8px;">🔴 已可取餐（請取餐）</div>
            ${(ready.length || justPicked) ? `<div style="display:flex;flex-wrap:wrap;gap:10px;">${readyList}</div>` : `<div style="color:var(--ink-soft);font-size:13px;padding:2px 0;">目前沒有可取餐的號碼</div>`}
          </div>
          <div style="margin-top:10px;">
            <div style="font-weight:900;font-size:14px;margin-bottom:8px;">🔵 準備取餐（製作中）</div>
            ${preparing.length ? `<div style="display:flex;flex-wrap:wrap;gap:10px;">${preparing.map(prepChip).join('')}</div>` : `<div style="color:var(--ink-soft);font-size:13px;padding:2px 0;">目前沒有等待中的訂單</div>`}
          </div>
        </div>
      `;
    }

    function cartCount() {
      return state.cart.reduce((total, line) => total + line.qty, 0);
    }

    // ===== 加價選項（後台菜單編輯設定）：🥤 換套餐飲料只能選一個，➕ 加購可複選 =====
    function itemAddons(item) {
      return (item && Array.isArray(item.addons) ? item.addons : [])
        .map((a, i) => ({ i, name: (a.name || '').trim(), price: parseInt(a.price, 10) || 0, drink: !!a.drink }))
        .filter(a => a.name);
    }
    // 依目前彈窗選擇取出加價項目（存進購物車一行的 extras）
    function pickedExtras(item) {
      const list = itemAddons(item);
      const out = [];
      const d = list.find(a => a.drink && a.i === state.itemDrink);
      if (d) out.push(d);
      list.forEach(a => { if (!a.drink && state.itemAdds.indexOf(a.i) !== -1) out.push(a); });
      return out.map(a => ({ name: a.name, price: a.price, drink: a.drink }));
    }
    function extrasTotal(extras) {
      return (extras || []).reduce((sum, e) => sum + (parseInt(e.price, 10) || 0), 0);
    }
    function extrasLabel(extras) {
      return (extras || []).map(e => (e.drink ? '換' : '＋') + e.name).join('、');
    }
    function extrasKey(extras) {
      return (extras || []).map(e => (e.drink ? 'D' : 'A') + e.name + ':' + e.price).join('|');
    }

    // 解析購物車一行的名稱與價格：先找店內菜單，找不到再找附加商品（依所選規格）；價格含加價選項
    function resolveLine(line) {
      const ex = extrasTotal(line.extras);
      const it = getItem(line.id);
      if (it) return { name: it.name, price: it.price + ex };
      const a = state.addons.find(x => x.id === line.id);
      if (a) {
        const opts = a.options || [];
        const o = opts.find(x => x.id === line.opt) || opts[0] || null;
        const multi = opts.length > 1;
        return { name: a.name + (multi && o && o.label ? '（' + o.label + '）' : ''), price: (o ? o.price : 0) + ex };
      }
      return { name: line.name || '', price: (line.price || 0) + ex };
    }

    function cartTotal() {
      return state.cart.reduce((sum, line) => sum + resolveLine(line).price * line.qty, 0);
    }

    function inCartQty(id) {
      return state.cart.filter(line => line.id === id).reduce((sum, line) => sum + line.qty, 0);
    }

    function getCategoryOf(itemId) {
      return CURRENT_MENU.find(cat => cat.items.some(it => it.id === itemId));
    }

    function visibleCategories() {
      return CURRENT_MENU.filter(cat => !isHiddenForCustomer(cat) && cat.items.some(it => it.active !== false));
    }

    function addToCart(id, temp, note, qty, opt, extras) {
      opt = opt || '';
      extras = extras || [];
      const key = extrasKey(extras);
      const existing = state.cart.find(line => line.id === id && line.temp === (temp || '') && (line.note || '') === (note || '') && (line.opt || '') === opt && extrasKey(line.extras) === key);
      if (existing) {
        existing.qty += qty;
      } else {
        state.cart.push({ lineId: Date.now() + '_' + Math.floor(Math.random() * 1000), id, temp: temp || '', note: note || '', qty, opt, extras });
      }
    }

    function renderCustomer() {
      if (state.currentOrderId) {
        const order = orders.find(o => o.id === state.currentOrderId);
        if (order) {
          renderConfirmation(order);
          return;
        }
      }

      const cats = visibleCategories();
      const catBar = `
        <div class="cat-bar">
          ${cats.map(cat => `<button class="cat-chip" data-action="jump-cat" data-cat="${cat.id}">${cat.icon} ${cat.name}</button>`).join('')}
        </div>
      `;

      const menuSections = cats.map(category => {
        const items = category.items.filter(it => it.active !== false).map(item => renderMenuItem(category, item)).join('');
        return `<section class="section" id="sec-${category.id}"><div class="section-title"><span style="font-size:22px">${category.icon}</span><h2>${category.name}</h2><div class="section-divider"></div></div><div class="grid">${items}</div></section>`;
      }).join('');

      const addonSection = state.addons.length ? `
        <section class="section" id="sec-addons">
          <div class="section-title"><span style="font-size:22px">🧋</span><h2>附加商品</h2><div class="section-divider"></div></div>
          <div class="addon-intro">店裡的附加商品，可加入同一張訂單一起送出</div>
          <div class="addon-grid">${state.addons.map(renderAddonCard).join('')}</div>
        </section>
      ` : '';

      // 記住目前焦點欄位與游標、捲動位置，避免背景重畫時打斷打字或畫面跳動
      const activeEl = document.activeElement;
      const focusId = activeEl && activeEl.id ? activeEl.id : null;
      const caret = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
      const scrollY = window.scrollY;

      app.innerHTML = `
        ${addonSection}
        <button class="button-primary" data-action="toggle-board" style="width:100%;justify-content:center;margin-bottom:12px;background:#fff;color:var(--pink-deep);border:2px solid var(--pink);font-weight:800;">📺 ${state.showBoard ? '收起叫號板' : '查看叫號板（看可取餐號碼）'}</button>
        ${state.showBoard ? renderCallBoard(null) : ''}
        <div class="toggle-row">
          <button class="${state.diningType === '內用' ? 'active' : ''}" data-action="set-dining" data-type="內用">🍽️ 內用</button>
          <button class="${state.diningType === '外帶' ? 'active' : ''}" data-action="set-dining" data-type="外帶">🛍️ 外帶</button>
        </div>
        ${catBar}
        ${menuSections}
        ${state.activeItem ? renderItemSheet() : (state.cartOpen ? renderCartSheet() : '')}
      `;

      attachEvents();
      updateCartBar();
      updateActiveCat();

      // 還原焦點與游標
      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) {
          el.focus();
          if (caret != null && typeof el.setSelectionRange === 'function') {
            try { el.setSelectionRange(caret, caret); } catch (e) {}
          }
        }
      }
      if (scrollY) window.scrollTo(0, scrollY); // 還原捲動位置
    }

    function renderMenuItem(category, item) {
      if (item.soldOut) {
        return `
        <div class="card" style="opacity:.55;">
          <div class="menu-info">
            <div class="menu-title"><span>${item.name}</span><span class="menu-price">$${item.price}</span></div>
          </div>
          <button class="pill-button" disabled style="opacity:.8;cursor:default;">售完</button>
        </div>`;
      }
      const inCart = inCartQty(item.id);
      return `
        <div class="card menu-card" data-action="open-item" data-id="${item.id}">
          <div class="menu-info">
            <div class="menu-title"><span>${item.name}</span><span class="menu-price">$${item.price}</span></div>
            ${category.temp ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">可選 冷／熱</div>` : ''}
            ${inCart ? `<div style="font-size:11px;color:var(--pink-deep);margin-top:3px;font-weight:700;">🛒 已加入 ${inCart} 份</div>` : ''}
          </div>
          <button class="add-circle" data-action="open-item" data-id="${item.id}">＋</button>
        </div>
      `;
    }

    function renderAddonCard(a) {
      const opts = a.options || [];
      const selId = state.addonOpt[a.id] || (opts[0] && opts[0].id) || '';
      const o = opts.find(x => x.id === selId) || opts[0] || null;
      const price = o ? o.price : 0;
      const orig = o ? o.orig : null;
      const thumb = a.img
        ? `<img class="addon-thumb" src="${escapeHtml(a.img)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'addon-thumb-ph',textContent:'🍽️'}))">`
        : `<div class="addon-thumb-ph">🍽️</div>`;
      const optSel = opts.length > 1 ? `<div class="addon-opts">${opts.map(op =>
        `<button class="${op.id === selId ? 'on' : ''}" data-action="addon-opt" data-id="${a.id}" data-opt="${escapeHtml(op.id)}">${escapeHtml(op.label || '規格')}</button>`).join('')}</div>` : '';
      const priceHtml = orig
        ? `<div class="addon-price"><span class="orig">$${orig}</span>$${price}</div>`
        : `<div class="addon-price">$${price}</div>`;
      return `
        <div class="addon-card">
          ${thumb}
          <div class="addon-body">
            <div class="addon-name">${escapeHtml(a.name)}</div>
            ${priceHtml}
            ${optSel}
            <button class="addon-add" data-action="addon-add" data-id="${a.id}" data-opt="${escapeHtml(selId)}">＋ 加入</button>
          </div>
        </div>
      `;
    }

    function renderItemSheet() {
      const item = getItem(state.activeItem);
      if (!item) return '';
      const category = getCategoryOf(item.id);
      const hasTemp = !!(category && category.temp);
      const temp = hasTemp ? (state.itemTemp || '冷') : '';
      const qty = state.itemQty || 1;
      const extras = pickedExtras(item);
      const extraSum = extrasTotal(extras);
      const subtotal = (item.price + extraSum) * qty;
      const addons = itemAddons(item);
      const drinkOpts = addons.filter(a => a.drink);
      const addOpts = addons.filter(a => !a.drink);

      return `
        <div class="overlay" data-action="close-item">
          <div class="sheet" data-ignore>
            <div class="sheet-header">
              <h3>${item.name}</h3>
              <button data-action="close-item" style="border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:20px;">✕</button>
            </div>
            <div style="color:var(--pink);font-weight:900;font-size:18px;margin-bottom:16px;">$${item.price}${extraSum ? `<span style="font-size:14px;color:var(--ink-soft);"> ＋加價 $${extraSum}</span>` : ''}</div>
            ${hasTemp ? `
              <div style="font-weight:700;margin-bottom:6px;">溫度</div>
              <div class="toggle-row">
                <button class="${temp === '冷' ? 'active' : ''}" data-action="item-temp" data-temp="冷">🧊 冷</button>
                <button class="${temp === '熱' ? 'active' : ''}" data-action="item-temp" data-temp="熱">🔥 熱</button>
              </div>
            ` : ''}
            ${drinkOpts.length ? `
              <div style="font-weight:700;margin:6px 0;">🥤 更換飲料${item.baseDrink ? `<span style="font-weight:400;color:var(--ink-soft);font-size:12px;">（套餐原本附 ${escapeHtml(item.baseDrink)}）</span>` : ''}</div>
              <div class="opt-grid">
                ${item.baseDrink ? `<button class="opt-chip ${state.itemDrink < 0 ? 'active' : ''}" data-action="item-drink" data-idx="-1">${escapeHtml(item.baseDrink)}（不加價）</button>` : ''}
                ${drinkOpts.map(a => `<button class="opt-chip ${state.itemDrink === a.i ? 'active' : ''}" data-action="item-drink" data-idx="${a.i}">${state.itemDrink === a.i ? '✓ ' : ''}${escapeHtml(a.name)} +$${a.price}</button>`).join('')}
              </div>
            ` : ''}
            ${addOpts.length ? `
              <div style="font-weight:700;margin:6px 0;">➕ 加購（可複選）</div>
              <div class="opt-grid">
                ${addOpts.map(a => `<button class="opt-chip ${state.itemAdds.indexOf(a.i) !== -1 ? 'active' : ''}" data-action="item-addon" data-idx="${a.i}">${state.itemAdds.indexOf(a.i) !== -1 ? '✓ ' : ''}${escapeHtml(a.name)} +$${a.price}</button>`).join('')}
              </div>
            ` : ''}
            <div style="font-weight:700;margin:6px 0;">餐點備註</div>
            ${(() => {
              const opts = (item.opts && item.opts.length) ? item.opts : noteOptionsFor(category ? category.id : '');
              return opts.length ? `<div class="opt-grid">${opts.map(o => `<button class="opt-chip ${state.itemOptions.includes(o) ? 'active' : ''}" data-action="item-opt" data-opt="${escapeHtml(o)}">${state.itemOptions.includes(o) ? '✕ ' : ''}${escapeHtml(o)}</button>`).join('')}</div>` : '';
            })()}
            <input id="item-note-input" class="input-group" placeholder="其他備註（例：醬多一點、餐點切塊）" value="${escapeHtml(state.itemNote || '')}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px;">
              <span style="font-weight:700;">數量</span>
              <div class="stepper">
                <button class="circle-button" data-action="item-qty-dec">－</button>
                <div style="font-weight:900;min-width:24px;text-align:center;font-size:18px;">${qty}</div>
                <button class="circle-button filled" data-action="item-qty-inc">＋</button>
              </div>
            </div>
            <button class="button-submit" data-action="confirm-add-item">＋ 加入購物車 · $${subtotal}</button>
          </div>
        </div>
      `;
    }

    function renderCartSheet() {
      const lines = state.cart;
      const content = lines.length === 0 ? '<div style="color:var(--ink-soft);text-align:center;padding:18px 0;">購物車目前是空的</div>' : lines.map(line => {
        const item = resolveLine(line);
        if (!item.name) return '';
        return `
          <div class="line-item">
            <div style="min-width:0;">
              <span style="font-weight:700">${escapeHtml(item.name)}</span>
              ${line.temp ? `<span style="margin-left:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:${line.temp === '冷' ? 'var(--blue-bg)' : 'rgba(232,154,43,.15)'};color:${line.temp === '冷' ? 'var(--blue)' : 'var(--amber)'}">${line.temp}</span>` : ''}
              ${line.note ? `<div style="font-size:12px;color:var(--amber);margin-top:2px;">📝 ${escapeHtml(line.note)}</div>` : ''}
              <div style="font-size:12px;color:var(--ink-soft);">$${item.price}</div>
            </div>
            <div class="stepper">
              <button class="circle-button" data-action="dec-line" data-line="${line.lineId}">－</button>
              <div style="font-weight:900;min-width:16px;text-align:center">${line.qty}</div>
              <button class="circle-button filled" data-action="inc-line" data-line="${line.lineId}">＋</button>
              <button class="small-button" data-action="rm-line" data-line="${line.lineId}">🗑</button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="overlay" data-action="close-sheet">
          <div class="sheet" data-ignore>
            <div class="sheet-header">
              <h3>確認餐點</h3>
              <button data-action="close-sheet" style="border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:20px;">✕</button>
            </div>
            <div style="display:grid;gap:8px;margin-bottom:14px;">${content}</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-bottom:8px;">
              用餐方式：<span style="font-weight:800;color:var(--pink-deep);">${state.diningType}</span>（可於上方切換）
            </div>
            <input id="phone-input" type="tel" inputmode="numeric" maxlength="10" class="input-group" placeholder="手機（必填，例：0912345678）" value="${escapeHtml(state.phone)}">
            <input id="table-input" class="input-group" placeholder="${state.diningType === '內用' ? '桌號（例：3號桌）' : '取餐名稱（必填，例：小美）'}" value="${escapeHtml(state.tableInfo)}" style="margin-top:8px;">
            <input id="note-input" class="input-group" placeholder="整單備註（例：餐具、不附吸管）" value="${escapeHtml(state.note)}" style="margin-top:8px;">
            <button class="button-submit" data-action="submit-order">🔔 送出訂單 · $${cartTotal()}</button>
          </div>
        </div>
      `;
    }

    // 讓等餐時螢幕不自動休眠（保持螢幕開著，餐好才能自動跳出可取餐）
    let _wakeLock = null;
    async function keepScreenAwake() {
      try { if ('wakeLock' in navigator && state.currentOrderId && (!_wakeLock || _wakeLock.released)) { _wakeLock = await navigator.wakeLock.request('screen'); } } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && state.currentOrderId) keepScreenAwake(); });

    function renderConfirmation(order) {
      keepScreenAwake(); // 保持螢幕不休眠
      const stepOrder = ['new', 'cook', 'done'];
      const stepMap = {
        new: { label: '新訂單', color: 'var(--amber)', icon: '🔔' },
        cook: { label: '製作中', color: 'var(--blue)', icon: '👨‍🍳' },
        done: { label: '完成', color: 'var(--green)', icon: '✔️' },
      };
      const stepIndex = stepOrder.indexOf(order.status);
      const stepHtml = stepOrder.map((status, index) => {
        const active = index <= stepIndex;
        return `
          <div style="text-align:center;">
            <div class="step-dot" style="background:${active ? stepMap[status].color : '#e6eef2'};width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;">${stepMap[status].icon}</div>
            <div style="margin-top:4px;font-size:11px;font-weight:700;color:${active ? stepMap[status].color : '#9db4bf'}">${stepMap[status].label}</div>
          </div>
          ${index < stepOrder.length - 1 ? `<div style="flex:1;height:3px;border-radius:2px;background:${index < stepIndex ? stepMap[stepOrder[index + 1]].color : '#e6eef2'};"></div>` : ''}
        `;
      }).join('');

      const itemsHtml = order.items.map(item => {
        const mi = getItem(item.id);
        const nm = item.name || (mi && mi.name) || '未知品項';
        const price = (item.price != null ? item.price : (mi ? mi.price : 0));
        return `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;padding:3px 0;">
          <span>${nm}${item.temp ? `（${item.temp}）` : ''} ×${item.qty}${item.note ? `<span style="color:var(--amber);"> · 📝${escapeHtml(item.note)}</span>` : ''}</span>
          <span style="color:var(--ink-soft);white-space:nowrap;">$${price * item.qty}</span>
        </div>
      `; }).join('');

      const isReady = !!order.notified && !order.picked; // 可取餐狀態（廚房按「通知取餐」才亮）
      app.innerHTML = `
        <div>
          <div style="background:${isReady ? 'linear-gradient(135deg,#3fb27f,#2c8f62)' : '#fff'};border-radius:22px;padding:24px;box-shadow:0 4px 14px rgba(28,94,122,.1);text-align:center;${isReady ? 'color:#fff;' : ''}">
            <div style="font-size:46px;">${order.picked ? '✅' : (isReady ? '🎉' : '🐟')}</div>
            <h2 style="margin:6px 0 2px;font-weight:900;${isReady ? 'font-size:26px;' : ''}">${order.picked ? '已完成取餐' : (isReady ? '可以取餐囉！' : (state.ack === 'pending' || state.ack === 'stuck' ? '訂單傳送中…' : '訂單已送出！'))}</h2>
            <div style="font-size:14px;${isReady ? 'color:rgba(255,255,255,.9);' : 'color:var(--ink-soft);'}">${isReady ? '請憑此號碼到櫃台取餐' : '取餐號碼'}</div>
            <div style="font-size:${isReady ? '58px' : '40px'};font-weight:900;color:${isReady ? '#fff' : 'var(--pink)'};letter-spacing:2px;line-height:1.1;">${order.no}</div>
            <div style="display:flex;align-items:center;gap:4px;margin:18px 4px 8px;flex-wrap:wrap;justify-content:center;">${stepHtml}</div>
            <div style="font-size:13px;margin-top:6px;${isReady ? 'color:#fff;font-weight:800;' : 'color:var(--ink-soft);'}">${order.picked ? '✅ 已完成取餐，謝謝惠顧！' : (isReady ? '🍽️ 餐點好囉！請到櫃台取餐' : '畫面會自動更新，請留意叫號')}</div>
          </div>
          ${(!isReady && !order.picked) ? renderAckNotice() : ''}
          ${(!isReady && !order.picked) ? renderPickupNotice(order) : ''}
          <div style="background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 2px 6px rgba(28,94,122,.07);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <span style="font-weight:700;">${order.type} · ${escapeHtml(order.table)}${order.phone ? ` · 📞 ${escapeHtml(order.phone)}` : ''}</span>
              <span style="color:var(--ink-soft);font-size:13px;">${new Date(order.createdAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false })}</span>
            </div>
            ${itemsHtml}
            ${order.note ? `<div style="font-size:13px;color:var(--amber);margin-top:6px;background:rgba(232,154,43,.1);border-radius:8px;padding:5px 8px;">備註：${escapeHtml(order.note)}</div>` : ''}
            <div style="display:flex;align-items:center;justify-content:space-between;font-weight:900;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;"><span>合計</span><span style="color:var(--pink);">$${order.total}</span></div>
          </div>
          <div style="margin-top:14px;">${renderCallBoard(order.no)}</div>
          ${(order.notified || order.picked)
            ? `<button class="button-primary" data-action="new-order" style="width:100%;background:#fff;color:var(--pink-deep);border:2px solid var(--pink);font-weight:700;">${order.picked ? '✅ 已取餐，再點一單' : '再點一單'}</button>`
            : `<div style="text-align:center;color:var(--ink-soft);font-size:13px;margin-top:6px;">餐點製作中，完成後即可再點下一單 🍳</div>`}
          <button class="button-primary" data-action="home" style="width:100%;margin-top:10px;background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);font-weight:700;justify-content:center;">🏠 回首頁</button>
        </div>
      `;

      attachEvents();
      updateCartBar();
    }

    function updateCartBar() {
      const count = cartCount();
      if (count > 0 && !state.currentOrderId) {
        cartBar.style.display = 'flex';
        cartInfo.textContent = `🛒 ${count} 項 · $${cartTotal()}`;
      } else {
        cartBar.style.display = 'none';
      }
    }

    function updateActiveCat() {
      const chips = Array.from(document.querySelectorAll('.cat-chip'));
      if (!chips.length) return;
      let activeId = null;
      visibleCategories().forEach(cat => {
        const sec = document.getElementById('sec-' + cat.id);
        if (sec && sec.getBoundingClientRect().top <= 80) activeId = cat.id;
      });
      if (!activeId) {
        const first = visibleCategories()[0];
        if (first) activeId = first.id;
      }
      chips.forEach(chip => chip.classList.toggle('active', chip.dataset.cat === activeId));
      const active = chips.find(chip => chip.classList.contains('active'));
      if (active) {
        const bar = active.parentElement;
        bar.scrollLeft = active.offsetLeft - bar.clientWidth / 2 + active.clientWidth / 2;
      }
    }

    function attachEvents() {
      app.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', handleAction));
      app.querySelectorAll('[data-ignore]').forEach(el => el.addEventListener('click', e => e.stopPropagation()));
      const tableInput = document.getElementById('table-input');
      const noteInput = document.getElementById('note-input');
      const itemNoteInput = document.getElementById('item-note-input');
      const memberInput = document.getElementById('phone-member');
      const phoneInput = document.getElementById('phone-input');
      if (tableInput) tableInput.addEventListener('input', e => state.tableInfo = e.target.value);
      if (noteInput) noteInput.addEventListener('input', e => state.note = e.target.value);
      if (itemNoteInput) itemNoteInput.addEventListener('input', e => state.itemNote = e.target.value);
      // 手機欄位：只允許數字、最長 10 碼，且不會被重整洗掉（值存在 state）
      const onPhoneInput = key => e => {
        const v = e.target.value.replace(/\D/g, '').slice(0, 10);
        state[key] = v;
        if (e.target.value !== v) e.target.value = v;
      };
      if (memberInput) memberInput.addEventListener('input', onPhoneInput('memberPhone'));
      if (phoneInput) phoneInput.addEventListener('input', onPhoneInput('phone'));
    }

    function handleAction(event) {
      const btn = event.currentTarget;
      const action = btn.dataset.action;
      if (!action) return;
      event.stopPropagation();

      if (action === 'toggle-board') {
        state.showBoard = !state.showBoard;
        renderCustomer();
        return;
      }

      if (action === 'self-pickup') {
        const id = btn.dataset.id;
        const order = orders.find(o => o.id === id);
        if (order && !order.picked) {
          order.picked = true; // 樂觀更新：顧客自行確認取餐
          state.justPickedId = id; // 短暫顯示藍色「已取餐」
          syncUpdateOrder(id, { picked: true, updatedAt: Date.now() });
          showMessage('✅ 已確認取餐，謝謝惠顧！');
          renderCustomer();
          setTimeout(() => { state.justPickedId = ''; renderCustomer(); }, 1500);
        }
        return;
      }

      if (action === 'open-item') {
        const id = btn.dataset.id;
        const category = getCategoryOf(id);
        state.activeItem = id;
        state.itemTemp = (category && category.temp) ? '冷' : '';
        state.itemQty = 1;
        state.itemNote = '';
        state.itemOptions = [];
        state.itemDrink = -1;
        state.itemAdds = [];
        state.cartOpen = false;
        renderCustomer();
      } else if (action === 'item-drink') {
        // 換飲料只能選一個；再按一次取消，回到套餐原本的飲料
        const ix = parseInt(btn.dataset.idx, 10);
        state.itemDrink = (state.itemDrink === ix || ix < 0) ? -1 : ix;
        renderCustomer();
      } else if (action === 'item-addon') {
        const ix = parseInt(btn.dataset.idx, 10);
        state.itemAdds = state.itemAdds.indexOf(ix) !== -1 ? state.itemAdds.filter(x => x !== ix) : state.itemAdds.concat([ix]);
        renderCustomer();
      } else if (action === 'item-opt') {
        const o = btn.dataset.opt;
        if (state.itemOptions.includes(o)) state.itemOptions = state.itemOptions.filter(x => x !== o);
        else state.itemOptions = state.itemOptions.concat([o]);
        renderCustomer();
      } else if (action === 'close-item') {
        state.activeItem = null;
        renderCustomer();
      } else if (action === 'item-temp') {
        state.itemTemp = btn.dataset.temp;
        renderCustomer();
      } else if (action === 'item-qty-inc') {
        state.itemQty = (state.itemQty || 1) + 1;
        renderCustomer();
      } else if (action === 'item-qty-dec') {
        state.itemQty = Math.max(1, (state.itemQty || 1) - 1);
        renderCustomer();
      } else if (action === 'confirm-add-item') {
        const item = getItem(state.activeItem);
        const noteEl = document.getElementById('item-note-input');
        const freeText = (noteEl ? noteEl.value : (state.itemNote || '')).trim();
        const extras = pickedExtras(item);
        // 加價選項寫進備註最前面，廚房／收銀／後台的每個畫面都看得到
        const note = (extras.length ? [extrasLabel(extras)] : []).concat(state.itemOptions, freeText ? [freeText] : []).join('、');
        const qty = state.itemQty || 1;
        const temp = state.itemTemp || '';
        addToCart(state.activeItem, temp, note, qty, '', extras);
        showMessage(`已加入購物車：${item ? item.name : ''}${temp ? '（' + temp + '）' : ''}${extras.length ? '（' + extrasLabel(extras) + '）' : ''} ×${qty}`);
        state.activeItem = null;
        renderCustomer();
      } else if (action === 'addon-opt') {
        state.addonOpt[btn.dataset.id] = btn.dataset.opt;
        renderCustomer();
      } else if (action === 'addon-add') {
        const a = state.addons.find(x => x.id === btn.dataset.id);
        if (a) {
          const opts = a.options || [];
          const opt = btn.dataset.opt || (opts[0] && opts[0].id) || '';
          addToCart(a.id, '', '', 1, opt);
          showMessage('已加入購物車：' + resolveLine({ id: a.id, opt }).name);
          renderCustomer();
        }
      } else if (action === 'jump-cat') {
        const el = document.getElementById('sec-' + btn.dataset.cat);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else if (action === 'inc-line') {
        const line = state.cart.find(l => l.lineId === btn.dataset.line);
        if (line) { line.qty += 1; renderCustomer(); }
      } else if (action === 'dec-line') {
        const line = state.cart.find(l => l.lineId === btn.dataset.line);
        if (line) {
          if (line.qty <= 1) state.cart = state.cart.filter(l => l.lineId !== line.lineId);
          else line.qty -= 1;
          renderCustomer();
        }
      } else if (action === 'rm-line') {
        state.cart = state.cart.filter(l => l.lineId !== btn.dataset.line);
        renderCustomer();
      } else if (action === 'set-dining') {
        state.diningType = btn.dataset.type;
        renderCustomer();
      } else if (action === 'close-sheet') {
        state.cartOpen = false;
        renderCustomer();
      } else if (action === 'submit-order') {
        submitOrder();
      } else if (action === 'new-order') {
        try { localStorage.removeItem('xyg-cust-active'); } catch (e) {} // 解除一機一單鎖定、重置
        state.currentOrderId = null;
        state.cart = [];
        state.diningType = '內用';
        state.tableInfo = '';
        state.phone = '';
        state.memberPhone = '';
        state.note = '';
        state.cartOpen = false;
        state.activeItem = null;
        state.itemOptions = [];
        state.itemDrink = -1;
        state.itemAdds = [];
        state.submitting = false;
        state.showBoard = false;
        renderCustomer();
      } else if (action === 'enable-push') {
        // 顧客在確認訂單頁補開通知；要在點擊手勢裡呼叫，瀏覽器才會跳權限視窗
        const o = orders.find(x => x.id === state.currentOrderId);
        if (!o) return;
        ensureOrderPush(o).then(() => {
          renderCustomer(); // 依最新授權狀態換掉說明區塊
          if (Notification.permission === 'granted') showMessage('🔔 已開啟，餐點好了會通知你');
          else if (Notification.permission === 'denied') showMessage('通知被封鎖了，請到瀏覽器設定開啟');
        });
      } else if (action === 'home') {
        const o = orders.find(x => x.id === state.currentOrderId);
        const inProgress = o && o.status !== 'done' && !o.picked;
        if (inProgress && !confirm('回首頁後，這支手機就不會再顯示這張訂單的叫號（訂單仍會照常製作）。確定要回首頁嗎？')) return;
        try { localStorage.removeItem('xyg-cust-active'); } catch (e) {} // 解除一機一單鎖定
        state.currentOrderId = null;
        state.cart = [];
        state.diningType = '內用';
        state.tableInfo = '';
        state.phone = '';
        state.memberPhone = '';
        state.note = '';
        state.cartOpen = false;
        state.activeItem = null;
        state.itemOptions = [];
        state.itemDrink = -1;
        state.itemAdds = [];
        state.submitting = false;
        state.showBoard = false;
        renderCustomer();
      }
    }

    // ===== 點餐成功提示音（Web Audio，免外部音檔）=====
    let _audioCtx = null;
    function _getAudioCtx() {
      if (_audioCtx) return _audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      _audioCtx = new AC();
      return _audioCtx;
    }
    // 提示音音檔（HTMLAudio，相容性最高）；手機互動一次即解鎖
    const _alertAudio = new Audio(window.ALERT_SOUND_URI || '');
    _alertAudio.preload = 'auto';
    let _audioUnlocked = false;
    function _unlockAudio() {
      const ctx = _getAudioCtx();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      if (_audioUnlocked) return;          // 只解鎖一次，之後點畫面不會再碰音檔
      _audioUnlocked = true;
      // iOS/Safari 的 volume 是唯讀（設 0 沒用，會整段放出來）；改用 muted 靜音解鎖，
      // 顧客一開系統／點畫面才不會聽到取餐提示音
      const reset = () => {
        try { _alertAudio.pause(); _alertAudio.currentTime = 0; } catch (e) {}
        _alertAudio.muted = false; _alertAudio.volume = 1;
      };
      try {
        _alertAudio.muted = true;
        const p = _alertAudio.play();
        if (p && p.then) p.then(reset).catch(() => { reset(); _audioUnlocked = false; });
        else reset();
      } catch (e) { reset(); _audioUnlocked = false; }
    }
    document.addEventListener('touchend', _unlockAudio, { passive: true });
    document.addEventListener('click', _unlockAudio, { passive: true });
    // 可取餐時顧客手機響：優先播音檔（相容性最高，平板/舊手機也能響），失敗才用 Web Audio
    function playReadySound() {
      let ok = false;
      try {
        if (window.ALERT_SOUND_URI) {
          _alertAudio.currentTime = 0; _alertAudio.muted = false; _alertAudio.volume = 1;
          const p = _alertAudio.play();
          if (p && p.catch) p.catch(() => {});
          ok = true;
        }
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 200]);
    }
    // 偵測「自己的訂單」是否剛被廚房按完成 → 響鈴（首次載入或已完成的舊單不會響）
    let _prevNotified = null;
    function checkMyOrderReady(list) {
      if (!state.currentOrderId) { _prevNotified = null; return; }
      const o = list.find(x => x.id === state.currentOrderId);
      if (!o) { _prevNotified = null; return; }
      if (_prevNotified === false && o.notified === true && !o.rejected) {
        playReadySound(); // 廚房按「通知取餐」→ 響
        state.showBoard = true; // 展開叫號板
        setTimeout(() => { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); } }, 60); // 強制跳到最上面，直接顯示可取餐畫面
      }
      _prevNotified = !!o.notified;
    }
    // 顧客授權通知 → 取得 FCM token 存進訂單，餐點完成時才推播得到（關網頁也收得到）
    async function ensureOrderPush(order) {
      try {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
        if (typeof firebase === 'undefined' || typeof firebase.messaging !== 'function') return;
        if (typeof PUSH_CONFIG === 'undefined' || !PUSH_CONFIG.vapidKey || PUSH_CONFIG.vapidKey.indexOf('PASTE') !== -1) return;
        let perm = Notification.permission;
        if (perm === 'default') perm = await Notification.requestPermission();
        if (perm !== 'granted') return;
        const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm-scope/' });
        const token = await firebase.messaging().getToken({ vapidKey: PUSH_CONFIG.vapidKey, serviceWorkerRegistration: reg });
        if (token) syncUpdateOrder(order.id, { fcmToken: token });
      } catch (e) { console.warn('推播設定略過', e); }
    }
    // 通知後端(廚房/收銀)有新訂單 → 後端裝置推播（關網頁也會響）
    function notifyBackend(order) {
      try {
        if (typeof PUSH_CONFIG === 'undefined' || !PUSH_CONFIG.notifyBackendEndpoint || PUSH_CONFIG.notifyBackendEndpoint.indexOf('PASTE') !== -1) return;
        fetch(PUSH_CONFIG.notifyBackendEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ no: order.no, table: order.table, type: order.type }) }).catch(() => {});
      } catch (e) {}
    }

    // ===== 訂單送達確認 =====
    // 「送出」只代表寫進手機的排隊佇列，不代表店家收到（訊號差時會卡在手機裡）。
    // 這裡等伺服器真正確認才把畫面切成「店家已接收 ✓」，並且改成確認後才通知店裡響鈴 ——
    // 以前是送出當下就打通知，訊號差時通知發不出去、訂單也還沒到，店裡什麼都不知道。
    let _ackStop = null, _ackTimer = null;
    function startAckWatch(orderId, fresh) {
      if (_ackStop) { try { _ackStop(); } catch (e) {} _ackStop = null; }
      if (_ackTimer) { clearTimeout(_ackTimer); _ackTimer = null; }
      state.ack = 'pending';
      let sawPending = false;
      // 8 秒還沒送達 → 升級成紅色警告，提醒顧客先別關頁、別鎖螢幕
      _ackTimer = setTimeout(() => {
        if (state.ack === 'pending') { state.ack = 'stuck'; renderCustomer(); }
      }, 8000);
      _ackStop = watchOrderAck(orderId, (st, data) => {
        if (st !== 'sent') { sawPending = true; return; }
        if (_ackTimer) { clearTimeout(_ackTimer); _ackTimer = null; }
        const changed = state.ack !== 'sent';
        state.ack = 'sent';
        // 只在「這次送出」或「親眼看到從排隊變送達」時響店裡的鈴：
        // 重開頁面看到早已送達的舊單不再重複吵店家
        if ((fresh || sawPending) && data) notifyBackendOnce(orderId, data);
        if (changed) renderCustomer();
      });
    }
    function stopAckWatch() {
      if (_ackStop) { try { _ackStop(); } catch (e) {} _ackStop = null; }
      if (_ackTimer) { clearTimeout(_ackTimer); _ackTimer = null; }
      state.ack = null;
    }
    // 同一張單只通知店裡一次（防重開頁面重複推播）
    function notifyBackendOnce(orderId, order) {
      try { if (localStorage.getItem('xyg-bknotif') === orderId) return; } catch (e) {}
      if (order.status && order.status !== 'new') return; // 店家已在處理，不必再響
      notifyBackend(order);
      try { localStorage.setItem('xyg-bknotif', orderId); } catch (e) {}
    }
    // 訂單狀態頁最上方的送達狀態條
    function renderAckNotice() {
      const box = (bg, line, ink, html) =>
        `<div style="background:${bg};border:1.5px solid ${line};border-radius:14px;padding:12px 14px;margin-top:12px;text-align:center;color:${ink};font-weight:800;font-size:14px;line-height:1.5;">${html}</div>`;
      switch (state.ack) {
        case 'pending':
          return box('#fff8e6', '#f0b64b', '#a86a12', '📤 訂單傳送中…請先別關閉此頁');
        case 'stuck':
          return box('#fdeceb', '#d9534f', '#b3322b',
            '⚠️ 訊號不佳，訂單還沒傳到店家！<br>'
            + '<span style="font-weight:500;font-size:13px;">請不要關閉此頁、先別鎖螢幕，連上網路會自動送出。'
            + '若一直卡住，請換個位置收訊好一點再試，或直接向店家出示此畫面。</span>');
        case 'sent':
          return box('#e6f6ee', '#54b98a', '#217a55', '✅ 店家已收到訂單');
        default:
          return '';
      }
    }

    async function submitOrder() {
      if (state.submitting) return; // 防連點：避免一次送出產生重複訂單
      if (cartCount() === 0) {
        showMessage('請先加入餐點');
        return;
      }
      const phone = (state.phone || '').trim();
      // 必填手機（每張單綁一支手機作為身份）；外帶另需取餐名稱
      if (!/^09\d{8}$/.test(phone)) { showMessage('請填正確手機號碼（09 開頭共 10 碼）'); return; }
      if (state.diningType === '外帶' && !state.tableInfo.trim()) { showMessage('外帶請填取餐名稱'); return; }
      state.submitting = true;
      // 不論成功、失敗還是中途丟出例外，離開前一定要把送出鍵解鎖。
      // 以前少了這一步：只要下面的取號卡住（網路半死時交易會一直等），
      // submitting 就永遠是 true，送出鍵從此沒反應，顧客只能關掉重開。
      try {
        await submitOrderInner(phone);
      } finally {
        state.submitting = false;
      }
    }

    async function submitOrderInner(phone) {
      // 在「送出」手勢中先要求通知權限（餐點完成才推播得到）
      try { if ('Notification' in window && Notification.permission === 'default' && typeof PUSH_CONFIG !== 'undefined' && PUSH_CONFIG.vapidKey && PUSH_CONFIG.vapidKey.indexOf('PASTE') === -1) Notification.requestPermission(); } catch (e) {}
      // 全店唯一取餐號（線上交易取號，保證不撞；失敗退回裝置前綴）
      let no = await nextDailyNo();
      if (!no) no = orderNo(orders);
      const order = {
        id: getDeviceId() + '-' + Date.now(), // 裝置碼+時間戳：全域唯一，離線重傳也不會在雲端重複
        deviceId: getDeviceId(),
        no: no,
        type: state.diningType,
        table: state.tableInfo.trim() || (state.diningType === '內用' ? '未填桌號' : '未填名稱'),
        phone: phone,
        note: state.note.trim(),
        items: state.cart.map(line => {
          const info = resolveLine(line);
          return { id: line.id, name: info.name, price: info.price, temp: line.temp || '', note: line.note || '', qty: line.qty, opt: line.opt || '', extras: line.extras || [] };
        }),
        total: cartTotal(),
        status: 'new',
        pay: { method: null, paid: false },
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      orders = orders.concat([order]); // 樂觀更新，雲端快照回來後會自動校正
      syncAddOrder(order);
      ensureOrderPush(order); // 取得推播 token 存進訂單（完成時才推播得到）
      state.currentOrderId = order.id;
      try { localStorage.setItem('xyg-cust-active', order.id); } catch (e) {} // 一機一單：記住進行中訂單
      state.cart = [];
      state.cartOpen = false;
      // 店裡的響鈴通知改由 startAckWatch 在「伺服器確認收到」後才發（見 notifyBackendOnce）
      startAckWatch(order.id, true);
      showMessage('訂單送出中…');
      renderCustomer();
    }

    cartBar.addEventListener('click', () => {
      state.activeItem = null;
      state.cartOpen = !state.cartOpen;
      renderCustomer();
    });

    window.addEventListener('scroll', () => {
      if (!state.currentOrderId && !state.activeItem && !state.cartOpen) updateActiveCat();
    }, { passive: true });

    // 一機一單：若本機有進行中的訂單，重開仍回到該訂單狀態頁（避免同一支手機重複下單）
    try { state.currentOrderId = localStorage.getItem('xyg-cust-active') || null; } catch (e) {}
    // 重開頁面也要繼續確認送達：訂單若上次卡在手機裡，這次連上時會補送並通知店裡響鈴
    if (state.currentOrderId) startAckWatch(state.currentOrderId, false);
    // 訂單還沒送達店家就要關頁 → 跳出瀏覽器的確認視窗擋一下
    window.addEventListener('beforeunload', e => {
      if (state.ack === 'pending' || state.ack === 'stuck') { e.preventDefault(); e.returnValue = ''; }
    });

    renderCustomer();
    initSync(list => {
      orders = list;
      // 進行中的訂單若已被清掉（例如隔日清除），自動解鎖回到點餐
      if (state.currentOrderId && !orders.some(o => o.id === state.currentOrderId)) {
        const stillCaching = list.length === 0;
        if (!stillCaching) {
          state.currentOrderId = null;
          stopAckWatch(); // 訂單已被清掉，送達監看跟著收掉
          try { localStorage.removeItem('xyg-cust-active'); } catch (e) {}
        }
      }
      checkMyOrderReady(list); // 餐點完成 → 響鈴通知顧客
      // 雲端任何變動都即時重畫（號碼變色/文字改變/消失都會跟著動）；已保留焦點與捲動位置避免干擾點餐
      renderCustomer();
    }, { today: true });
    initConfig(() => {
      syncAnnouncementUI(); // 公告按鈕在標題列，跟點餐畫面分開更新
      if (!state.currentOrderId) renderCustomer();
    });
    initAddons();

    // 附加商品：訂閱 config/addons（店家在管理後台 admin.html 的「附加商品」分頁維護）
    function initAddons() {
      // 先用預設種子讓顧客馬上看得到（鮮乳／手作蘿蔔糕），雲端有資料再覆蓋
      if (!state.addons.length) { state.addons = DEFAULT_ADDONS; if (!state.currentOrderId) renderCustomer(); }
      const db = ensureDb();
      if (!db) return;
      db.collection('config').doc('addons').onSnapshot(snap => {
        const list = (snap.exists && snap.data() && Array.isArray(snap.data().list)) ? snap.data().list : null;
        // 雲端已經有這份文件就完全以它為準（店家全部下架或刪光時，這一區也要跟著不見）；
        // 查無文件才維持預設種子
        if (!list) return;
        state.addons = list.filter(a => a && a.active !== false && Array.isArray(a.options) && a.options.length);
        if (!state.currentOrderId) renderCustomer();
      }, err => { console.warn('附加商品同步中斷', err); });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker failed:', err));
    }
  </script>
</body>
</html>
